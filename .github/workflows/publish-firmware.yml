name: Publish Firmware

on:
  push:
    branches:
      - develop
      - master
      - baymesh-refactor
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh dependencies'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-firmware
  cancel-in-progress: false

env:
  FIRMWARE_VERSION: '2.7.21'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      long: ${{ steps.version.outputs.long }}
    steps:
      - uses: actions/checkout@v6
      - name: Get release version string
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version
        env:
          BUILD_LOCATION: local

  build:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        board: [rak4631, t-echo, nano-g2-ultra, tbeam, m5stack-core, rak11200, heltec-v3, t-deck, station-g2, heltec-hru-3601, tlora-c6, rak11310]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download nanopb
        run: |
          wget -q https://jpa.kapsi.fi/nanopb/download/nanopb-0.4.9.1-linux-x86.tar.gz
          tar xzf nanopb-0.4.9.1-linux-x86.tar.gz

      - name: Regenerate protobufs
        run: |
          cd protobufs
          ../nanopb-0.4.9.1-linux-x86/generator-bin/protoc \
            --experimental_allow_proto3_optional \
            "--nanopb_out=-S.cpp -v:../src/mesh/generated/" \
            -I=. meshtastic/*.proto

      - name: Commit regenerated protobufs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/mesh/generated/meshtastic/
          if git diff --cached --quiet; then
            echo "No proto changes to commit"
          else
            git commit -m "Regenerate protobufs C++ code from baymesh/protobufs"
            git push
          fi

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.board }}
        env:
          APP_VERSION: ${{ needs.version.outputs.long }}
        run: |
          VERSION=${{ needs.version.outputs.long }}
          BOARD=${{ matrix.board }}
          pio run --environment $BOARD --target mtjson || echo "Build may have failed, continuing..."
          BUILDDIR=.pio/build/$BOARD
          mkdir -p release
          if ls $BUILDDIR/firmware-$BOARD-${VERSION}.uf2 2>/dev/null; then
            cp $BUILDDIR/firmware-$BOARD-${VERSION}.uf2 release/
            cp $BUILDDIR/firmware-$BOARD-${VERSION}.elf release/ || true
            cp $BUILDDIR/firmware-$BOARD-${VERSION}.hex release/ || true
            cp $BUILDDIR/firmware-$BOARD-${VERSION}.zip release/ || true
            cp $BUILDDIR/firmware-$BOARD-${VERSION}.mt.json release/ || true
          fi
          echo "Built: $(ls release/*.uf2 2>/dev/null || echo 'none')"

      - name: Store artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}-${{ needs.version.outputs.long }}
          overwrite: true
          path: |
            release/*.mt.json
            release/*.uf2
            release/*.hex
            release/*.elf
            release/*.zip

  publish:
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./publish
          merge-multiple: true

      - name: Display artifacts
        run: ls -la publish/

      - name: Create release manifest
        env:
          VERSION: ${{ needs.version.outputs.long }}
        run: |
          cd publish
          python3 << 'PYEOF'
          import json
          import os
          import glob
          import datetime

          version = os.environ['VERSION']
          targets = []
          
          for mt in glob.glob('*.mt.json'):
              base = mt.replace('.mt.json', '')
              parts = base.split('-')
              if len(parts) >= 2:
                  board = parts[1]
                  uf2_files = glob.glob(f'firmware-{board}-{version}.uf2')
                  if uf2_files:
                      targets.append({
                          'board': board,
                          'firmware': os.path.basename(uf2_files[0])
                      })
          
          manifest = {
              'version': version,
              'build_date': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'targets': targets
          }
          
          with open(f'firmware-{version}.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Create release notes
        run: |
          cd publish
          cat > release_notes.md << 'EOF'
          # Baymesh Firmware

          ## Features

          ### MeshControl (Port 78)
          Remote configuration via signed HMAC packets.

          ### Relay Node
          - Broadcast relay_node: Specify which node rebroadcasts first
          - DM relay_node preference

          ### Hop Limit
          - HOP_MAX = 64

          ### Defaults
          - Position broadcast: OFF by default
          - Node info: Uses regular hop limit
          - Channel slot: 49

          ## ⚠️ Not Compatible with Standard Meshtastic
          This firmware is a custom fork. Only flash devices that will run Baymesh firmware.
          EOF

      - name: Create CNAME
        run: |
          cd publish
          echo "firmware.bayme.sh" > CNAME

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.FIRMWARE_PAGES_DEPLOY_KEY }}
          external_repository: baymesh/bayme.sh-firmware-pages
          publish_branch: gh-pages
          publish_dir: ./publish
          keep_files: true
          user_name: github-actions[bot]
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish firmware ${{ needs.version.outputs.long }}"
          enable_jekyll: false
